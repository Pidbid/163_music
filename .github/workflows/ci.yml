name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest

  linux:
    name: DEB (Ubuntu amd64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install packaging and runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils patchelf ccache xvfb \
            libegl1 libgl1 libglx0 libopengl0 libglvnd0 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-render0 libxcb-shape0 \
            libxcb-shm0 libxcb-sync1 libxcb-dri3-0 libxcb-present0 libxcb-glx0 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxcb-util1 \
            libx11-6 libx11-xcb1 libxcomposite1 libxdamage1 libxext6 \
            libxfixes3 libxrandr2 libxrender1 libxtst6 libxi6 libsm6 libice6 \
            libnss3 libnspr4 libasound2 libpulse0 libdbus-1-3 libfontconfig1 \
            libfreetype6 libpng16-16 libglib2.0-0 libgbm1 libdrm2 libexpat1 \
            libcups2 libxss1
      - name: Build onefile and DEB
        run: |
          chmod +x build_linux.sh
          xvfb-run -a ./build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: 163-music-linux
          path: |
            dist/163-music
            dist/163-music_*_amd64.deb
          if-no-files-found: error

  appimage:
    name: AppImage (x86_64)
    needs: linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install AppImage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils
      - uses: actions/download-artifact@v4
        with:
          name: 163-music-linux
          path: dist
      - name: Get appimagetool
        run: |
          curl -L --fail -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
      - name: Build AppImage
        run: |
          chmod +x dist/163-music scripts/build_appimage.sh
          APPIMAGETOOL=/tmp/appimagetool ./scripts/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: 163-music-appimage
          path: dist/163-music-*-x86_64.AppImage
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest
      - name: Build onefile EXE
        run: .\build_windows.bat
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: 163-music-windows
          path: dist/nuitka-windows/163-music.exe
          if-no-files-found: error

  macos:
    name: macOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest
      - name: Build app bundle
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: 163-music-macos
          path: dist/163-music-macos.zip
          if-no-files-found: error
